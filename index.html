<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cell Division Challenge</title><style>body{font-family:system-ui,Arial;background:#eef4fb;color:#17243b;margin:0}main{max-width:800px;margin:35px auto;background:white;border-radius:18px;padding:28px;box-shadow:0 8px 30px #2335}h1{color:#164a82}button{background:#185ba2;color:white;border:0;padding:13px 18px;border-radius:9px;cursor:pointer;font-size:16px;margin:6px 0}button:hover{background:#0b4078}.option{display:block;width:100%;text-align:left;background:#e9f1fb;color:#142e4b}.option:hover{background:#d2e4fa}.option:disabled{opacity:.75;cursor:default}.correct{background:#c7f0d5!important}.wrong{background:#fbd4d4!important}#feedback{padding:12px;border-radius:8px;margin-top:12px}#progress{height:10px;background:#dbe7f5;border-radius:10px;overflow:hidden}#bar{height:100%;background:#2b8b6b;width:0}small{color:#58677a}.hidden{display:none}input{padding:12px;font-size:16px;max-width:90%;border:1px solid #9db0c7;border-radius:8px}</style></head><body><main><h1>🧬 Cell Division Challenge</h1><p>Master mitosis and meiosis through five missions. Each question is worth 5 points.</p><section id="start"><label for="student">Name or nickname (optional)</label><p><input id="student" maxlength="50" placeholder="Student name"></p><button onclick="startGame()">Start Mission →</button></section><section id="game" class="hidden"><p><small id="meta"></small></p><div id="progress"><div id="bar"></div></div><h2 id="question"></h2><div id="options"></div><div id="feedback" aria-live="polite"></div><button id="next" class="hidden" onclick="nextQuestion()">Next question →</button></section><section id="finish" class="hidden"><h2>Mission complete! 🎉</h2><h3 id="score"></h3><p id="message"></p><button onclick="downloadResults()">Download my results (CSV)</button> <button onclick="location.reload()">Play again</button><p><small>Results are stored only in this browser session until downloaded. No answers are sent to a server.</small></p></section></main><script>
const Q=[
['Mission 1: Cell Cycle','During which phase is DNA replicated?',['G1','S phase','G2','Cytokinesis'],1,'DNA synthesis occurs during S phase of interphase.'],
['Mission 1: Cell Cycle','Which checkpoint helps prevent a cell with damaged DNA from entering S phase?',['G1/S checkpoint','Spindle checkpoint','Cytokinesis checkpoint','Metaphase II'],0,'The G1/S checkpoint assesses conditions and DNA integrity before replication.'],
['Mission 1: Cell Cycle','After DNA replication, a chromosome generally consists of:',['Two homologous chromosomes','Two sister chromatids joined at a centromere','Four daughter cells','One unreplicated chromatid'],1,'Replication produces sister chromatids, not a new homologous pair.'],
['Mission 1: Cell Cycle','A diploid cell has 2n = 8. How many chromosomes does it have in G2?',['4','8','16','32'],1,'Chromosome number remains eight after S phase; there are sixteen chromatids.'],
['Mission 2: Mitosis','During metaphase of mitosis, chromosomes:',['Line up at the metaphase plate','Exchange segments','Form four nuclei','Replicate their DNA'],0,'Chromosomes align individually at the cell equator.'],
['Mission 2: Mitosis','What separates during anaphase of mitosis?',['Homologous chromosomes','Sister chromatids','Alleles during crossing over','Nuclear envelopes'],1,'Sister chromatids separate and move toward opposite poles.'],
['Mission 2: Mitosis','One diploid cell with 2n = 6 completes mitosis and cytokinesis. The result is:',['Four cells with 3 chromosomes each','Two cells with 6 chromosomes each','Two cells with 3 chromosomes each','Four cells with 6 chromosomes each'],1,'Mitosis maintains chromosome number in the two daughter cells.'],
['Mission 2: Mitosis','Which event occurs in telophase?',['DNA replication','Homolog pairing','Nuclear envelopes re-form','Crossing over'],2,'Nuclear envelopes typically re-form around the separated chromosomes.'],
['Mission 3: Meiosis','Crossing over usually occurs during:',['Prophase I','Metaphase II','Anaphase II','Telophase II'],0,'Homologous chromosomes pair and exchange segments during prophase I.'],
['Mission 3: Meiosis','What separates in anaphase I?',['Sister chromatids','Homologous chromosomes','DNA strands','Nucleoli'],1,'Homologs separate in meiosis I while sister chromatids usually remain together.'],
['Mission 3: Meiosis','What separates in anaphase II?',['Homologous chromosomes','Sister chromatids','Whole tetrads','Cell membranes'],1,'Meiosis II separates sister chromatids.'],
['Mission 3: Meiosis','A diploid cell with 2n = 10 completes meiosis. Each normal haploid product has:',['5 chromosomes','10 chromosomes','20 chromosomes','2 chromosomes'],0,'The haploid number is n = 5.'],
['Mission 4: Compare & Contrast','Which process typically produces genetically varied haploid cells?',['Mitosis','Meiosis','Binary fission','DNA replication alone'],1,'Meiosis reduces ploidy and generates variation.'],
['Mission 4: Compare & Contrast','Independent assortment is caused by:',['Random orientation of homologous pairs at metaphase I','Sister chromatids aligning in mitosis','DNA copying during S phase','Cytokinesis'],0,'Homologous pairs orient independently in meiosis I.'],
['Mission 4: Compare & Contrast','Which statement is true of both mitosis and meiosis?',['Both always produce four cells','Both involve spindle-mediated chromosome movement','Both include homologous pairing','Both halve chromosome number'],1,'Spindle fibers move chromosomes in both processes.'],
['Mission 4: Compare & Contrast','How many rounds of DNA replication normally precede the two meiotic divisions?',['Zero','One','Two','Four'],1,'One S phase occurs before meiosis I; there is no new S phase before meiosis II.'],
['Mission 5: Apply It','A mutation prevents spindle attachment to a chromosome. Which checkpoint is most directly involved?',['Spindle assembly checkpoint','G1 restriction point','DNA synthesis checkpoint','G0 entry'],0,'The spindle checkpoint delays anaphase until chromosomes are properly attached.'],
['Mission 5: Apply It','Failure of homologous chromosomes to separate in meiosis I is called:',['Crossing over','Nondisjunction','Cytokinesis','Synapsis'],1,'Nondisjunction can generate gametes with abnormal chromosome numbers.'],
['Mission 5: Apply It','If a normal human gamete has 23 chromosomes, fertilization by two normal gametes produces a zygote with:',['23','46','69','92'],1,'Two haploid gametes combine to restore the diploid count of 46.'],
['Mission 5: Apply It','Why does meiosis contribute to genetic diversity?',['It always creates identical cells','It combines crossing over with independent assortment','It doubles the number of chromosomes in gametes','It prevents mutations entirely'],1,'Crossing over and independent assortment create new allele combinations.']
];
let i=0,points=0,answers=[],student='';function startGame(){student=document.getElementById('student').value.trim();document.getElementById('start').classList.add('hidden');document.getElementById('game').classList.remove('hidden');render()}
function render(){let q=Q[i];document.getElementById('meta').textContent=`${q[0]} • Question ${i+1} of ${Q.length} • Score: ${points}`;document.getElementById('bar').style.width=`${i/Q.length*100}%`;document.getElementById('question').textContent=q[1];document.getElementById('feedback').textContent='';document.getElementById('next').classList.add('hidden');let area=document.getElementById('options');area.innerHTML='';q[2].forEach((choice,k)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+k)+'. '+choice;b.onclick=()=>select(k);area.appendChild(b)})}
function select(k){let q=Q[i],good=k===q[3];if(good)points+=5;answers.push({question:q[1],selected:q[2][k],correct:q[2][q[3]],result:good?'Correct':'Incorrect'});document.querySelectorAll('.option').forEach((b,j)=>{b.disabled=true;if(j===q[3])b.classList.add('correct');else if(j===k)b.classList.add('wrong')});document.getElementById('feedback').textContent=(good?'✓ Correct! ':'✗ Not quite. ')+q[4];document.getElementById('next').textContent=i===Q.length-1?'View results →':'Next question →';document.getElementById('next').classList.remove('hidden')}
function nextQuestion(){i++;if(i<Q.length)render();else{document.getElementById('game').classList.add('hidden');document.getElementById('finish').classList.remove('hidden');document.getElementById('score').textContent=`${student?student+': ':''}${points}/100 (${points}%)`;document.getElementById('message').textContent=points>=85?'Excellent mastery!':points>=70?'Good progress! Review missed concepts and try again.':'Keep practicing. Read each explanation and replay the missions.'}}
function downloadResults(){let rows=[['Student','Score','Question','Selected answer','Correct answer','Result'],...answers.map(a=>[student,points,a.question,a.selected,a.correct,a.result])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='cell_division_results.csv';a.click();URL.revokeObjectURL(url)}
</script></body></html>
